<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="{{descripcion}}">
<link rel="canonical" href="https://safetyvr.com.co/demo/">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400..700&family=JetBrains+Mono:wght@400..500&display=swap">
<style>
/* Plataforma SAFETY VR — una sola apariencia oscura, de sala de control
   industrial: el visor 360° es el centro y todo lo demás lo acompaña. */
:root {
  color-scheme: dark;
  --fondo: #0d1217;
  --banda: #121a21;
  --panel: #18222b;
  --linea: #2a3743;
  --tinta: #eef2f5;
  --tenue: #9aa7b4;
  --seguridad: #f2bb1d;
  --seguridad-tinta: #1a1400;
  --bien: #4cc38a;
  --mal: #ff6b5e;
  --medio: #e3a23b;
  /* las mismas fuentes de la página comercial y la de inversión: un solo sitio */
  --display: "Reddit Sans", system-ui, sans-serif;
  --texto: "Reddit Sans", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--fondo); color: var(--tinta); font-family: var(--texto); font-size: 16px; line-height: 1.55; }
.ancho { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 500; margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
a { color: var(--seguridad); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--seguridad); outline-offset: 2px; }
.etiqueta { font-family: var(--mono); font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); }

/* barra superior */
.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(13,18,23,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--linea); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--fondo); }
.barra .ancho { display: flex; align-items: center; gap: 16px 24px; padding-block: 12px; flex-wrap: wrap; }
.marca { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--tinta); }
.marca .franja { width: 34px; height: 10px; background: repeating-linear-gradient(135deg, var(--seguridad) 0 7px, var(--fondo) 7px 14px); }
.marca b { font-family: var(--display); font-weight: 500; font-size: 1.25rem; letter-spacing: -0.01em; }
.nav { display: flex; gap: 18px; margin-left: auto; flex-wrap: wrap; }
.nav a { color: var(--tenue); text-decoration: none; font-size: .92rem; }
.nav a:hover { color: var(--tinta); }
/* en el teléfono la barra es una sola fila (logo e idioma): con el menú partido en tres filas medía 188 px y tapaba la página; sus enlaces están en el pie */
@media (max-width: 640px) { .barra .nav { display: none; } .barra .idioma { margin-left: auto; } .barra .ancho { flex-wrap: nowrap; } }
.idioma { display: flex; border: 1px solid var(--linea); border-radius: 6px; overflow: hidden; }
.idioma button { background: transparent; color: var(--tenue); border: 0; padding: 5px 10px; font-family: var(--mono); font-size: .78rem; }
.idioma button[aria-pressed="true"] { background: var(--tinta); color: var(--fondo); }

/* portada */
.portada { padding-block: 44px 28px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px; align-items: end; }
@media (max-width: 860px) { .portada { grid-template-columns: minmax(0, 1fr); padding-block: 28px 20px; } }
.portada h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1.02; font-weight: 700; }
.portada p { color: var(--tenue); max-width: 60ch; margin: 14px 0 0; font-size: 1.05rem; }
.ficha { background: var(--panel); border: 1px solid var(--linea); border-radius: 12px; padding: 18px 20px; display: grid; gap: 14px; }
.ficha h2 { font-size: 1.35rem; }
.ficha dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 16px; font-size: .92rem; }
.ficha dt { color: var(--tenue); }
.ficha dd { margin: 0; }
.acciones { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 1px solid var(--linea); background: var(--banda); color: var(--tinta); border-radius: 8px; padding: 10px 16px; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--tenue); }
.btn.primario { background: var(--seguridad); color: var(--seguridad-tinta); border-color: var(--seguridad); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.nota { color: var(--tenue); font-size: .86rem; margin: 0; }

/* visor */
.escena { padding-block: 8px 32px; }
.marco { position: relative; border: 1px solid var(--linea); border-radius: 14px; overflow: hidden; background: #000; }
.marco canvas { display: block; width: 100%; aspect-ratio: 16 / 9; max-height: 78vh; touch-action: none; cursor: grab; }
.marco canvas:active { cursor: grabbing; }
.portadilla { position: absolute; inset: 0; display: grid; place-items: center; background:
  radial-gradient(ellipse at 50% 40%, rgba(242,187,29,.10), transparent 60%),
  repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 64px),
  repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 64px), #0a0e12; }
.portadilla div { display: grid; gap: 14px; justify-items: center; text-align: center; padding: 20px; }
.portadilla .grande { font-family: var(--display); font-size: clamp(1.4rem, 3vw, 2.1rem); }
.mando { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; padding-top: 12px; }
.mando .acciones { gap: 8px; }

/* resultado */
.resultado { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; padding-bottom: 36px; }
@media (max-width: 860px) { .resultado { grid-template-columns: minmax(0, 1fr); } }
.tarjeta { background: var(--panel); border: 1px solid var(--linea); border-radius: 12px; padding: 20px; display: grid; gap: 12px; align-content: start; }
.sello { font-family: var(--display); font-weight: 600; font-size: 2.6rem; line-height: 1; letter-spacing: .03em; }
.sello.apto { color: var(--bien); } .sello.no_apto { color: var(--mal); } .sello.incompleta { color: var(--medio); }
.criterios { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.criterios li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--linea); font-size: .94rem; }
.pastilla { font-family: var(--mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; align-self: center; }
.p-correcto { color: var(--bien); } .p-incorrecto { color: var(--mal); } .p-parcial { color: var(--medio); } .p-null { color: var(--tenue); }
.certificado { border: 2px solid var(--seguridad); background: linear-gradient(180deg, rgba(242,187,29,.07), transparent 40%), var(--panel); }
.certificado .codigo { font-family: var(--mono); font-size: 1.3rem; letter-spacing: .06em; color: var(--seguridad); overflow-wrap: anywhere; }

/* verificar */
.verificar { padding-block: 40px; border-top: 1px solid var(--linea); background: var(--banda); }
.verificar .ancho { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 32px; align-items: start; }
@media (max-width: 860px) { .verificar .ancho { grid-template-columns: minmax(0, 1fr); } }
.verificar h2 { font-size: 2rem; }
.formulario { display: flex; gap: 10px; flex-wrap: wrap; }
.formulario input { flex: 1 1 240px; min-width: 0; font-family: var(--mono); font-size: 1rem; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--linea); background: var(--fondo); color: var(--tinta); }
.respuesta { margin-top: 14px; }
.respuesta .tarjeta.si { border-color: var(--bien); } .respuesta .tarjeta.no { border-color: var(--mal); }
.respuesta dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: .9rem; }
.respuesta dt { color: var(--tenue); } .respuesta dd { margin: 0; font-family: var(--mono); overflow-wrap: anywhere; }

.pie { padding-block: 24px 40px; color: var(--tenue); font-size: .86rem; }
.pie .ancho { display: flex; gap: 10px 24px; flex-wrap: wrap; justify-content: space-between; }
[hidden] { display: none !important; }
</style>

<header class="barra">
  <div class="ancho">
    <a class="marca" href="../" aria-label="SAFETY VR"><span class="franja" aria-hidden="true"></span><b>SAFETY VR</b></a>
    <nav class="nav">
      <a href="../#planes" data-t="plataforma.nav.planes"></a>
      <a href="#capacitacion" data-t="plataforma.nav.capacitacion"></a>
      <a href="#verificar" data-t="plataforma.nav.verificar"></a>
      <a href="../avance/" data-t="plataforma.nav.avance"></a>
    </nav>
    <div class="idioma" role="group" aria-label="Idioma / Language">
      <button type="button" id="i-es" data-idioma="es-CO">ES</button>
      <button type="button" id="i-en" data-idioma="en">EN</button>
    </div>
  </div>
</header>

<main id="inicio">
  <section class="ancho portada" id="capacitacion">
    <div>
      <div class="etiqueta">ULTRAMEDIA COMPANY</div>
      <h1 data-t="plataforma.titulo"></h1>
      <p data-t="plataforma.bajada"></p>
    </div>
    <div class="ficha">
      <div class="etiqueta" data-t="plataforma.escenario"></div>
      <h2 id="f-titulo"></h2>
      <dl id="f-datos"></dl>
      <div class="acciones">
        <button type="button" class="btn primario" id="b-empezar" data-t="plataforma.empezar"></button>
        <button type="button" class="btn" id="b-rv" data-t="plataforma.empezar_rv" disabled></button>
      </div>
      <p class="nota" id="n-rv" data-t="plataforma.rv_no_disponible"></p>
    </div>

  <section class="ancho escena" aria-label="Escena 360°">

      <canvas id="visor" aria-label="Escena 360°"></canvas>
      <div class="portadilla" id="portadilla">
        <div>
          <span class="grande" id="p-titulo"></span>
          <button type="button" class="btn primario" id="b-empezar-2" data-t="plataforma.empezar"></button>

  <section class="ancho resultado" id="resultado" hidden aria-live="polite">
    <div class="tarjeta" id="r-resumen"></div>

</main>

<section class="verificar" id="verificar">
  <div class="ancho">
    <div>
      <h2 data-t="plataforma.verificar.titulo"></h2>
      <p class="nota" data-t="plataforma.verificar.bajada"></p>
    </div>
    <div>
      <form class="formulario" id="v-form">
        <label for="v-codigo" class="etiqueta" data-t="plataforma.verificar.campo" style="flex-basis:100%"></label>
        <input id="v-codigo" autocomplete="off" spellcheck="false" placeholder="SVR-XXXX-XXXX-XXXX">
        <button type="submit" class="btn primario" data-t="plataforma.verificar.boton"></button>

  </div>
</section>

<footer class="pie">
  <div class="ancho">
    <span data-t="plataforma.pie"></span>
    <span><a href="../#planes" data-t="plataforma.nav.planes"></a> · <a href="#verificar" data-t="plataforma.nav.verificar"></a> · <a href="../avance/" data-t="plataforma.nav.avance"></a> · <a href="https://github.com/safetyvr360-tech/safety-vr" data-t="plataforma.codigo_fuente"></a></span>
  </div>
</footer>

<script>
/*__MOTOR__*/
const DATOS = /*__DATOS__*/;

const $ = (id) => document.getElementById(id);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt !== undefined) n.textContent = txt; return n; };
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const leer = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };

let idioma = leer('svr-idioma') === 'en' ? 'en' : 'es-CO';
const t = (clave, vars) => traducir(DATOS.catalogos[idioma], clave, vars);
const doc = ec01();
const tx = (texto) => texto[idioma] ?? texto[doc.idiomas[0]];

// Certificados de demostración: sin servidor, viven en este navegador.
const ORG = 'org-demo';
// Se relee antes de emitir: otra pestaña pudo agregar un eslabón y, si no, esta
// lo pisaría al guardar y la cadena quedaría rota.
const leerCerts = () => { try { const c = JSON.parse(leer('svr-certs') || '[]'); return Array.isArray(c) ? c : []; } catch (e) { return []; } };
let certs = leerCerts();
const uuid = crearGeneradorUuidv7();

let visor = null, sesionVista = null, idSesion = null, rvOk = false;

function pintarTextos() {
  document.documentElement.lang = idioma === 'en' ? 'en' : 'es-CO';
  document.title = t('plataforma.titulo_pagina');
  for (const n of document.querySelectorAll('[data-t]')) n.textContent = t(n.dataset.t);
  for (const b of document.querySelectorAll('[data-idioma]')) b.setAttribute('aria-pressed', String(b.dataset.idioma === idioma));
  $('f-titulo').textContent = `${doc.codigo} · ${tx(doc.titulo)}`;
  $('p-titulo').textContent = tx(doc.titulo);
  const dl = $('f-datos'); dl.replaceChildren();
  const fila = (a, b) => dl.append(el('dt', null, a), el('dd', null, b));
  fila(t('plataforma.duracion'), t('plataforma.duracion.valor'));
  fila(t('plataforma.decisiones'), String(doc.nodos.filter((n) => !n.final).length));
  fila(t('plataforma.aprobacion'), t('plataforma.aprobacion.valor', { puntaje: doc.puntaje_aprobacion }));
  $('n-rv').hidden = rvOk;
  pintarMando();
}

function pintarMando() {
  if (!visor) return;
  const s = visor.sesion();
  const viva = s.estadoActual().fase === 'en_curso';
  $('mando').hidden = false;
  $('b-pausa').textContent = s.enPausa() ? t('plataforma.reanudar') : t('plataforma.pausar');
  $('b-pausa').disabled = !viva;
}

function crear() {
  if (visor) return;
  visor = crearVisor({ canvas: $('visor'), doc, catalogos: DATOS.catalogos, idioma, alCambiar: () => { vigilar(); pintarMando(); } });
  $('portadilla').hidden = true;
  vigilar();
  pintarMando();
}

function empezar() {
  crear();
  $('visor').scrollIntoView({ block: 'center' });
}

async function empezarRV() {
  crear();
  try { await visor.entrarRV(); } catch (e) { $('n-rv').hidden = false; }
}

// Cada sesión nueva recibe su id; al cerrarse se muestra el resultado y, si
// aprobó, se emite el certificado encadenado al anterior.
function vigilar() {
  const s = visor.sesion();
  if (s !== sesionVista) { sesionVista = s; idSesion = uuid(); s.__cerrada = false; $('resultado').hidden = true; }
  const e = s.estadoActual();
  if ((e.fase === 'terminada' || e.fase === 'abandonada') && !s.__cerrada) { s.__cerrada = true; cerrar(s).catch(() => {}); }
}

let ultimo = null; // { s, cert } de la última sesión cerrada

async function cerrar(s) {
  const e = s.estadoActual();
  let cert = null, fallo = false;
  if (e.veredicto === 'apto') {
    // Si la emisión falla (p. ej. sin WebCrypto), el resultado se muestra igual.
    try {
      const paquete = await armarPaquete({
        id: idSesion, trabajador_id: 'trabajador-demo', version_simulador: `${doc.codigo}@${doc.version}`, dispositivo_id: 'navegador',
        escenario: doc.codigo, iniciada_en: new Date().toISOString(), duracion_s: s.duracionS(), puntaje: e.puntaje, veredicto: e.veredicto,
      }, [], 'demo');
      certs = leerCerts();
      cert = await emitirCertificado({ paquete, doc, organizacion_id: ORG, anterior: certs.at(-1) ?? null, ahoraMs: Date.now(), codigo: generarCodigo() });
      certs.push(cert);
      guardar('svr-certs', JSON.stringify(certs));
    } catch (err) {
      cert = null; fallo = true;
    }
  }
  ultimo = { s, cert, fallo };
  pintarResultado();
}

// Solo pinta: se puede llamar de nuevo (p. ej. al cambiar de idioma) sin emitir otro certificado.
function pintarResultado() {
  if (!ultimo || !visor || visor.sesion() !== ultimo.s) return;
  const e = ultimo.s.estadoActual();
  const v = visor.vista();
  const resumen = $('r-resumen'); resumen.replaceChildren();
  resumen.append(el('div', 'etiqueta', t('plataforma.resultado')), el('div', `sello ${e.veredicto}`, v.cierre.titulo.toUpperCase()), el('p', null, v.cierre.detalle), el('div', 'nota', v.puntaje));
  resumen.append(el('div', 'etiqueta', t('plataforma.criterios')));
  const ul = el('ul', 'criterios');
  for (const c of v.rubrica) { const li = el('li'); li.append(el('span', null, c.etiqueta), el('span', `pastilla p-${c.resultado}`, c.estado)); ul.append(li); }
  resumen.append(ul);
  const caja = $('r-certificado'); caja.replaceChildren(); caja.className = 'tarjeta';
  $('resultado').hidden = false;
  const cert = ultimo.cert;
  if (!cert) { caja.append(el('div', 'etiqueta', t('plataforma.certificado')), el('p', null, t(ultimo.fallo ? 'plataforma.certificado.error' : 'plataforma.sin_certificado'))); return; }
  caja.className = 'tarjeta certificado';
  const fecha = new Intl.DateTimeFormat(idioma, { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }).format(new Date(`${cert.vigente_hasta}T12:00:00Z`));
  caja.append(el('div', 'etiqueta', t('plataforma.certificado')), el('h3', null, tx(doc.titulo)),
    el('div', 'etiqueta', t('plataforma.certificado.codigo')), el('div', 'codigo', cert.codigo),
    el('div', 'nota', `${t('plataforma.certificado.vigente_hasta')}: ${fecha}`));
  const b = el('button', 'btn', t('plataforma.certificado.verificar')); b.type = 'button';
  b.addEventListener('click', () => { $('v-codigo').value = cert.codigo; verificarAhora(); $('verificar').scrollIntoView(); });
  caja.append(b, el('p', 'nota', t('plataforma.certificado.demo')));
}

async function verificarAhora() {
  const buscar = async (codigo) => {
    certs = leerCerts();
    const i = certs.findIndex((c) => c.codigo === codigo);
    return i < 0 ? null : { cert: certs[i], siguiente: certs[i + 1] ?? null };
  };
  const v = await verificarCodigo($('v-codigo').value, buscar, fechaCivil(Date.now()));
  const vista = presentarVerificacion(v, DATOS.catalogos[idioma], idioma, (c) => (c === doc.codigo ? doc.titulo : null));
  const caja = el('div', `tarjeta ${vista.confiable ? 'si' : 'no'}`);
  caja.append(el('div', `sello ${vista.confiable ? 'apto' : 'no_apto'}`, vista.titulo), el('p', null, vista.detalle));
  if (vista.filas.length) { const dl = el('dl'); for (const f of vista.filas) dl.append(el('dt', null, f.etiqueta), el('dd', null, f.valor)); caja.append(dl); }
  $('v-respuesta').replaceChildren(caja);
}

$('b-empezar').addEventListener('click', empezar);
$('b-empezar-2').addEventListener('click', empezar);
$('b-rv').addEventListener('click', empezarRV);
$('b-reiniciar').addEventListener('click', () => { if (visor) visor.reiniciar(); });
$('b-pausa').addEventListener('click', () => { const s = visor.sesion(); if (s.enPausa()) s.reanudar(); else s.pausar(); visor.refrescar(); });
$('v-form').addEventListener('submit', (e) => { e.preventDefault(); verificarAhora(); });
for (const b of document.querySelectorAll('[data-idioma]')) {
  b.addEventListener('click', () => {
    idioma = b.dataset.idioma; guardar('svr-idioma', idioma);
    pintarTextos();
    if (visor) visor.cambiarIdioma(idioma);
    pintarResultado();
    if ($('v-respuesta').childElementCount) verificarAhora();
  });
}
if (navigator.xr && navigator.xr.isSessionSupported) {
  navigator.xr.isSessionSupported('immersive-vr').then((ok) => { rvOk = ok; $('b-rv').disabled = !ok; pintarTextos(); }).catch(() => {});
}
pintarTextos();
</script>
